  <text x="90" y="185" fill="#F8FAFC" font-family="Inter,Arial,sans-serif" font-size="60" font-weight="700">From local evidence to reviewed gates.</text>
  <text x="90" y="238" fill="#CBD5E1" font-family="Inter,Arial,sans-serif" font-size="27">Pinned tooling, least privilege, and no accidental PHI in logs.</text>
  <rect x="90" y="305" width="840" height="585" rx="28" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="135" y="365" fill="#64748B" font-family="ui-monospace,SFMono-Regular,monospace" font-size="19">.github/workflows/fhir-validation.yml</text>
  <text x="135" y="425" fill="#7DD3FC" font-family="ui-monospace,SFMono-Regular,monospace" font-size="21">permissions:</text>
  <text x="175" y="462" fill="#E2E8F0" font-family="ui-monospace,SFMono-Regular,monospace" font-size="21">contents: read</text>
  <text x="135" y="518" fill="#7DD3FC" font-family="ui-monospace,SFMono-Regular,monospace" font-size="21">env:</text>
  <text x="175" y="555" fill="#E2E8F0" font-family="ui-monospace,SFMono-Regular,monospace" font-size="21">FHIR_RESOURCE_DIR: './examples'</text>
  <text x="135" y="611" fill="#7DD3FC" font-family="ui-monospace,SFMono-Regular,monospace" font-size="21">steps:</text>
  <text x="175" y="648" fill="#E2E8F0" font-family="ui-monospace,SFMono-Regular,monospace" font-size="21">- uses: actions/checkout@v4</text>
  <text x="175" y="690" fill="#E2E8F0" font-family="ui-monospace,SFMono-Regular,monospace" font-size="21">- run: npm install -g @records-fhir/cli@0.1.1</text>
  <text x="175" y="732" fill="#E2E8F0" font-family="ui-monospace,SFMono-Regular,monospace" font-size="21">- run: records validate-file "$FHIR_RESOURCE_DIR"</text>
